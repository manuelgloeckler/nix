# herdr config — https://herdr.dev/docs/configuration/
# Managed by nix (dotfiles/herdr/config.toml).
# Keybindings mirror dotfiles/tmux/tmux.conf (prefix C-Space, vim-style hjkl).

[keys]
# Herdr owns Ctrl+Space at the outer (Ghostty) layer; tmux inside panes uses C-b.
# The old Karabiner C-Space -> C-b remap was removed so the real key arrives.
prefix = "ctrl+space"

# Pane focus: tmux "bind -n M-h/j/k/l select-pane"
focus_pane_left = "alt+h"
focus_pane_down = "alt+j"
focus_pane_up = "alt+k"
focus_pane_right = "alt+l"

# Windows/tabs: tmux prefix+h previous, prefix+l next, prefix+n/prefix+p
previous_tab = "prefix+h"
next_tab = "prefix+l"
new_tab = "prefix+c"

# Splits: tmux prefix+| , prefix+- , prefix+v , prefix+s
split_vertical = "prefix+|"
split_horizontal = "prefix+-"

# Resize: tmux "bind -r H/J/K/L resize-pane"
resize_pane_left = "prefix+shift+h"
resize_pane_down = "prefix+shift+j"
resize_pane_up = "prefix+shift+k"
resize_pane_right = "prefix+shift+l"

# tmux prefix+d detach
detach = "prefix+d"

# nvim sidebar (herdr-nvim plugin) — full-height nvim beside your panes.
[[keys.command]]
key = "prefix+e"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar"

# Open a file from the current agent's recent output in the sidebar.
[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "open file from agent output"

# tmux: set -g mouse on / set-clipboard on (Herdr defaults, pinned explicitly)
[ui]
mouse_capture = true
copy_on_select = true
# Ayu Dark accent, matching the tmux status line (#e6b450).
accent = "#e6b450"

# tmux: set -g history-limit 500000 (approx. 50 MB of scrollback)
[advanced]
scrollback_limit_bytes = 50000000

# Persist across full server restarts (exit/relaunch, reboot).
[experimental]
# Save recent pane screen history across server restarts.
pane_history = true

[session]
# Resume supported agents into their native conversation sessions on restore.
resume_agents_on_restore = true
startup_per_agent_delay_ms = 100
