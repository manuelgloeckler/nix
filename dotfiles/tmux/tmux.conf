# === Core settings ===
# Prefix: Ctrl+Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix
set -g default-command "${SHELL}"
set -g history-limit 500000
set -s default-terminal "tmux-256color"
set -s escape-time 50
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Let terminal graphics pass through tmux.
set -g allow-passthrough on

# Forward extended (CSI-u / kitty) keys to apps that request them.
set -s extended-keys on
set -as terminal-features '*:extkeys'

# === Vim mode ===
setw -g mode-keys vi
set -g status-keys vi

# Copy mode: v to select, y to yank (like vim visual mode).
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Prefix + [ enters copy mode; prefix + ] pastes.

# === Vim-style pane navigation ===
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Splits and windows inherit the current pane's directory.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Session management helpers are expected in ~/bin.
bind-key f run-shell "tmux neww ~/bin/tmux-sessionizer"
bind-key S run-shell "~/bin/tmux-save && tmux display-message 'Session saved!'"
bind-key R run-shell "~/bin/tmux-restore && tmux display-message 'Sessions restored!'"
bind-key g run-shell "tmux neww ~/bin/tmux-ls"
bind-key i command-prompt -p "img path:" "new-window -c \"#{pane_current_path}\" -n img '~/bin/ticat-view \"%%\"'"

# Double-click a path to copy it and preview image files when supported.
set -g word-separators " "
set -g set-clipboard on
bind -T root DoubleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { run-shell -b "~/bin/tmux-maybe-preview #{?mouse_hyperlink,#{q:mouse_hyperlink},__NONE__} #{?mouse_word,#{q:mouse_word},__NONE__} #{q:pane_current_path}" }

# === Visual: Ayu Dark theme ===
set -g status-style "bg=#0d1017,fg=#565b66"
set -g status-left "#[fg=#e6b450,bold] #S #[fg=#565b66]│ "
set -g status-left-length 30
set -g status-right "#[fg=#565b66]#{s/.facebook.com//:host} #[fg=#39bae6]%H:%M"
set -g status-right-length 50

setw -g window-status-format "#[fg=#565b66] #I:#W "
setw -g window-status-current-format "#[fg=#e6b450,bold] #I:#W "
setw -g window-status-separator ""

set -g pane-border-style "fg=#131721"
set -g pane-active-border-style "fg=#e6b450"
set -g message-style "bg=#131721,fg=#e6b450"
set -g message-command-style "bg=#131721,fg=#e6b450"
setw -g mode-style "bg=#39bae6,fg=#0d1017"

# Enhanced session picker (overrides default prefix+w).
bind-key w run-shell "tmux neww ~/bin/tmux-picker"
